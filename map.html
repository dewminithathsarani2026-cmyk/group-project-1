<!DOCTYPE html>
<html>
<head>
    <title>Google Maps API Example</title>
    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
function initMap() {
    const location = { lat: 6.9271, lng: 79.8612 }; // Colombo, Sri Lanka

    const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 12,
        center: location
    });

    new google.maps.Marker({
        position: location,
        map: map,
        title: "Colombo"
    });
}
</script>

<script async defer
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
</script>

</body>
</html>
